services:
  foodflow-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../data:/data
    ports:
      - "${FOODFLOW_HOST_PORT:-4320}:4320"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4320/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
